name: ronditrack
description: RondiTrack mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '3.13.7'
  flutter: '3.47.9'

dependencies:
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 23.0.0
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  image: 4.12.0
  image_picker: 1.2.4
  json_annotation: 4.12.0
  package_info_plus: 10.2.2
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7
  sentry_flutter: 10.3.0

dev_dependencies:
  alchemist: 0.14.1
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  integration_test:
    sdk: flutter
  json_serializable: 6.15.2
  mocktail: 1.0.5
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  sentry_dart_plugin: 3.4.0
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0

dependency_overrides:
  _flutterfire_internals: 1.3.79
  archive: 4.6.0
  code_assets: 2.1.0
  firebase_core_platform_interface: 8.1.1
  firebase_core_web: 4.1.0
  firebase_messaging_platform_interface: 4.11.1
  firebase_messaging_web: 4.3.1
  image_picker_ios: 0.8.13+15
  material_ui: 1.10.0
  objective_c: 9.6.2
  sqlite3: 3.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  wait_for_processing: true
  commits: 'false'