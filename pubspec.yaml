name: ronditrack
description: RondiTrack mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '3.13.7'
  flutter: '3.47.9'

dependencies:
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  json_annotation: 4.12.0
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  json_serializable: 6.15.2
  mocktail: 1.0.5
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0

dependency_overrides:
  code_assets: 2.1.0
  material_ui: 1.10.0
  objective_c: 9.6.2
  sqlite3: 3.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf