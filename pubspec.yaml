name: ronditrack
description: RondiTrack mobile app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '3.13.7'
  flutter: '3.47.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  riverpod_generator: 4.0.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-LICENSE.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf