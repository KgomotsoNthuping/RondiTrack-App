name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/assign-*'
  workflow_dispatch:
    inputs:
      api_ref:
        description: API branch or commit for contract comparison
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: UTC
    steps:
      - name: Checkout app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check dependency ages
        run: dart run tool/check_dependency_age.dart

      - name: Generate application parts
        run: dart run build_runner build

      - name: Check generated client drift
        run: dart run tool/check_api_drift.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run fast tests and collect coverage
        run: flutter test --no-pub --coverage --exclude-tags live

      - name: Enforce committed coverage floor
        run: dart run tool/check_coverage.dart

      - name: Check South African dates under UTC
        env:
          TZ: UTC
        run: flutter test --no-pub test/south_african_dates_test.dart

      - name: Check South African dates under Johannesburg
        env:
          TZ: Africa/Johannesburg
        run: flutter test --no-pub test/south_african_dates_test.dart

      - name: Build web app
        run: flutter build web --release --dart-define-from-file=config/dev.json --dart-define=SENTRY_DSN=

      - name: Upload coverage and golden failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-test-evidence
          if-no-files-found: ignore
          path: |
            coverage/lcov.info
            test/**/failures/**

  android-journey:
    needs: [checks, contract-copy]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Restore dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate application parts
        run: dart run build_runner build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android dev journey
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tool/run_android_journey_ci.sh

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-journey-evidence
          if-no-files-found: ignore
          path: integration-artifacts/

  contract-copy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout app
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Read API contract source
        id: source
        env:
          API_REF_OVERRIDE: ${{ inputs.api_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source = json.loads(Path("contract/source.json").read_text(encoding="utf-8-sig"))
          ref = os.environ.get("API_REF_OVERRIDE", "").strip() or source["ref"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={source['repository']}\n")
              output.write(f"ref={ref}\n")
          PY

      - name: Checkout API contract source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.ref }}
          path: api-contract-source
          persist-credentials: false

      - name: Compare the contract copies
        run: python tool/check_api_contract.py api-contract-source